version: 2

updates:
  - package-ecosystem: docker-compose
    directory: /
    commit-message:
      prefix: build
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
    schedule:
      interval: monthly

  - package-ecosystem: pre-commit
    directory: /
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns:
          - "*"
    schedule:
      interval: monthly
