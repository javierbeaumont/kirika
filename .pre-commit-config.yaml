repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # CI stages nothing: check every file.
      - id: check-added-large-files
        args: [--enforce-all, --maxkb=100]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      # Also outside a merge, where CI runs.
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-submodules
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        name: insert-license (Go)
        files: '\.go$'
        args: [--license-filepath=tools/license-header.txt, --comment-style=//]
      - id: insert-license
        name: insert-license (shell/Make)
        files: '\.sh$|(^|/)Makefile$'
        args: [--license-filepath=tools/license-header.txt, --comment-style=#]
  - repo: local
    hooks:
      - id: go-mod-tidy
        name: go mod tidy (Docker)
        entry: make tidy
        language: system
        files: '\.go$|^go\.(mod|sum)$'
        pass_filenames: false
        require_serial: true
      - id: golangci-lint
        name: golangci-lint (Docker)
        entry: make lint
        language: system
        files: '\.go$|^(\.golangci\.yml|Makefile|docker-compose\.yml|go\.(mod|sum))$'
        pass_filenames: false
        require_serial: true
      # Go reads a build line only before the package clause. The tier comes first in it, and the rest only narrows it.
      - id: integration-tag
        name: integration test files carry the integration tag
        entry: '\A(?:(?://[^\n]*)?\n)*//go:build integration(?: && [^\n|]+)?\n'
        language: pygrep
        args: [--multiline, --negate]
        files: '_integration_test\.go$'
      # A tab counts as 4 columns; editorconfig-checker counts it as 1.
      - id: makefile-width
        name: Makefile lines fit in 120 columns
        entry: >-
          awk '{ line = $0; gsub(/\t/, "    ", line); if (length(line) > 120) { print FILENAME ":" FNR; wide = 1 } } END
          { exit wide }'
        language: system
        files: '(^|/)Makefile$'
      # A name that goes on in lower case is no test, nor is a TestMain that takes a *testing.M.
      - id: test-helpers
        name: test files outside a tier hold no test
        entry: '^func (Test(?!Main\((\w+ )?\*testing\.M\))|Benchmark|Fuzz|Example)[^a-z]'
        language: pygrep
        files: '_test\.go$'
        exclude: '_(unit|integration)_test\.go$'
      # The build line as in integration-tag.
      - id: unit-tag
        name: unit test files carry the unit tag
        entry: '\A(?:(?://[^\n]*)?\n)*//go:build unit(?: && [^\n|]+)?\n'
        language: pygrep
        args: [--multiline, --negate]
        files: '_unit_test\.go$'
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v4.0.2
    hooks:
      - id: editorconfig-checker
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      # The hook above scans what is staged, nothing in CI; this one scans every commit.
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (history)
        entry: gitleaks git --redact --verbose
        stages: [manual]
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.3.0
    hooks:
      - id: reuse
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      # Its warnings fail too.
      - id: yamllint
        args: [--strict]
